version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: daily
      commit-message:
          prefix: build(deps)
      groups:
          commitlint:
              applies-to: version-updates
              patterns:
                  - "@commitlint/*"
          compatible:
              applies-to: version-updates
              update-types:
                  - minor
                  - patch
          security:
              applies-to: security-updates
              patterns:
                  - "*"
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: daily
      commit-message:
          prefix: ci(deps)
      groups:
          shared-actions:
              applies-to: version-updates
              patterns:
                  - "*"
          security:
              applies-to: security-updates
              patterns:
                  - "*"
